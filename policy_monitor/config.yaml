    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：数字经济/算力/数据要素/AI/工业互联网/5G/信创"

  # A10. 中小企业与专精特新
  - name: "国务院-中小企业"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E4%B8%AD%E5%B0%8F%E4%BC%81%E4%B8%9A&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：中小企业/专精特新/融资/减税/创新/上市"

  # A11. 专项资金与补贴
  - name: "国务院-专项资金补贴"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E4%B8%93%E9%A1%B9%E8%B5%84%E9%87%91+%E8%A1%A5%E8%B4%B4&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：专项资金/补贴/申报/产业基金/股权投资/拨改投"

  # A12. 工信部政策（替代失效的HTML源）
  - name: "国务院-工业和信息化"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E5%B7%A5%E4%B8%9A%E5%92%8C%E4%BF%A1%E6%81%AF%E5%8C%96&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
