    type: "html"
    frequency: "weekly"
    selectors:
      list: ".list_content li a, .trs_paper_default14 li a"
    enabled: true
    note: "覆盖：科技政策/创新基金/高新技术企业/科技成果转化"

# ============================================================
# 关键词配置（覆盖五大产业分类核心术语）
# ============================================================
global_keywords:
  # 高优先级：命中一个 +3 分（标题命中 +6 分）
  high_priority:
    # 资金/项目类
    - "专项资金"
    - "补贴"
    - "申报"
    - "试点"
    - "拨改投"
    - "产业基金"
    - "股权投资"
    - "首台套"
    - "首批次"
    # 战略性新兴产业
    - "集成电路"
    - "低空经济"
    - "新型储能"
    - "智能机器人"
    - "人工智能"
    - "量子"
    - "氢能"
    - "碳纤维"
    # 生物/种业
    - "生物育种"
    - "种业振兴"
    - "粮食安全"
    # 高端制造
    - "专精特新"
    - "智能制造"
    - "工业母机"
    # 数字经济
    - "算力"
    - "数据要素"
    - "东数西算"
    # 新兴支柱产业
    - "生物医药"
    - "航空航天"
    - "具身智能"
    - "6G"
    - "脑机接口"
    - "生物制造"

  # 中优先级：命中一个 +1 分（标题命中 +2 分）
  medium_priority:
    # 通用政策术语
    - "认定"
    - "扶持"
    - "奖励"
    - "示范"
    - "创新平台"
    - "产业链"
    - "中小企业"
    - "高新技术企业"
    # 战略性新兴产业
    - "新能源"
    - "新材料"
    - "高端装备"
    - "航空航天"
    - "海洋装备"
    - "生物医药"
    - "绿色环保"
    - "新能源汽车"
    - "工业互联网"
    - "5G"
    - "芯片"
    # 传统制造业
    - "技改"
    - "石化"
    - "钢铁"
    - "有色"
    - "建材"
    - "机械"
    - "汽车"
    - "电力装备"
    # 基础设施
    - "水利"
    - "电网"
    - "物流"
    - "交通"
    - "算力网"
    - "数据中心"
    - "城市更新"
    - "管网"
    # 三次产业
    - "农业"
    - "服务业"
    - "消费"
    - "乡村振兴"
    - "制造业"
    - "建筑业"
    - "数字经济"
    # 能源
    - "煤炭"
    - "石油"
    - "天然气"
    - "核电"
    - "风电"
    - "光伏"
    # 外贸
    - "外贸"
    - "自贸区"
    - "跨境电商"
    # 环保
    - "碳达峰"
    - "碳中和"
    - "污染防治"
    - "生态修复"

  # 观察级：命中仅记录，不加分
  watch:
    - "产业规划"
    - "监管"
    - "合规"
    - "准入"
    - "标准"
    - "安全"
    - "环保"
    - "碳排放"

# ============================================================
# 地区配置
# ============================================================
regions:
  dir: regions
  default: null
  include_national: true

# ============================================================
# 安全策略
# ============================================================
safety:
  min_delay_seconds: 30
  max_delay_seconds: 60
  max_pages_per_source: 2
  respect_robots: true
  timeout_seconds: 15
  max_retries: 2
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0"
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36 Edg/125.0.0.0"

# ============================================================
# 评分阈值
# ============================================================
scoring:
  p0_threshold: 6
  p1_threshold: 3
