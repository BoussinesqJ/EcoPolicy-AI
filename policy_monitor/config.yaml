# ============================================================
# 政策监控配置 v2.0
# 策略：国务院API多关键词覆盖 + 已验证HTML源 + 省级源
# 更新：2026-05-23 - 五大产业分类全覆盖
# ============================================================

sources:
  # ============================================================
  # A. 国务院政策文件库（核心源，覆盖所有部委政策）
  # 通过不同关键词搜索，实现按部委/产业分类覆盖
  # ============================================================

  # A1. 全量政策（每次必跑）
  - name: "国务院-政策文件库"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=&timetype=timeqb&mintime=&maxtime=&sort=pubtime&sortType=1&searchfield=title&p=0&n=20&inpro="
    type: "api"
    frequency: "daily"
    enabled: true
    note: "国务院政策文件库，全量政策"

  # A2. 战略性新兴产业（九大领域 + 六大支柱）
  - name: "国务院-战略性新兴产业"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E6%88%98%E7%95%A5%E6%80%A7%E6%96%B0%E5%85%B4%E4%BA%A7%E4%B8%9A&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：新一代信息技术/新能源/新材料/高端装备/新能源汽车/绿色环保/航空航天/海洋装备/集成电路/生物医药/低空经济/新型储能/智能机器人"

  # A3. 未来产业（六大方向）
  - name: "国务院-未来产业"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E6%9C%AA%E6%9D%A5%E4%BA%A7%E4%B8%9A&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：量子科技/生物制造/氢能/核聚变/脑机接口/具身智能/6G"

  # A4. 传统制造业转型（十大重点稳增长行业）
  - name: "国务院-制造业转型"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E5%88%B6%E9%80%A0%E4%B8%9A+%E8%BD%AC%E5%9E%8B&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：石化/钢铁/有色/建材/机械/汽车/电力装备/轻工/电子信息/智能制造/技改"

  # A5. 基础设施（六张网）
  - name: "国务院-基础设施"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E5%9F%BA%E7%A1%80%E8%AE%BE%E6%96%BD&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：水网/电网/算力网/新型通信网/城市地下管网/物流网"

  # A6. 农业与种业（第一产业）
  - name: "国务院-农业与种业"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E5%86%9C%E4%B8%9A+%E7%A7%8D%E4%B8%9A&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：农业/种业/乡村振兴/粮食安全/生物育种/农机"

  # A7. 生物医药
  - name: "国务院-生物医药"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E7%94%9F%E7%89%A9%E5%8C%BB%E8%8D%AF&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖：生物医药/创新药/医疗器械/生物制品"

  # A8. 新能源与储能
  - name: "国务院-新能源储能"
