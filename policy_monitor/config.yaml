  # ============================================================
  # B. 已验证的 HTML 源（直接抓取，数据质量好）
  # ============================================================
  - name: "生态环境部"
    url: "https://www.mee.gov.cn/ywgz/fgbz/fl/"
    type: "html"
    frequency: "weekly"
    selectors:
      list: ".list_content li a"
    enabled: true
    note: "覆盖：生态修复/污染治理/碳交易/环保标准"

  - name: "自然资源部"
