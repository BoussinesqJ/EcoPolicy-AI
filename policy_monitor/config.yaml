# ============================================================
# 地区配置
# ============================================================
regions:
  dir: regions
  default: null
  include_national: true

# ============================================================
# 安全策略
# ============================================================
safety:
  # API 源延迟 3-8 秒（同一服务器，远低于反爬阈值）
  # HTML 源延迟 10-20 秒（不同服务器）
  min_delay_seconds: 3
  max_delay_seconds: 8
  max_pages_per_source: 3
  respect_robots: true
  timeout_seconds: 15
  max_retries: 2
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0"
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36 Edg/125.0.0.0"

# ============================================================
# 评分阈值
# ============================================================
scoring:
  p0_threshold: 6
  p1_threshold: 3

# ============================================================
# 定时任务配置 (Phase C)
# ============================================================
scheduler:
  enabled: false
  enterprise_id: ""          # 默认匹配的企业 ID
  region: null               # 默认抓取的地区（null = 全国）
  industry: null             # 默认产业分类（null = 全部）
  schedule_type: "daily_8am" # daily_8am / weekly_monday
  auto_report: true          # 自动生成报告
  report_max_count: 5        # 每次最多生成报告数
  notify_email: null         # 通知邮箱（可选）
