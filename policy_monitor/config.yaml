    enabled: true
    note: "覆盖工信部政策：工业母机/首台套/智能制造/工业互联网/中小企业"

  # A13. 发改委政策（替代失效的HTML源）
  - name: "国务院-发展改革"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E5%8F%91%E5%B1%95%E6%94%B9%E9%9D%A9&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖发改委政策：产业规划/重大项目/价格改革/区域发展"

  # A14. 能源政策（替代失效的能源局HTML源）
  - name: "国务院-能源政策"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E8%83%BD%E6%BA%90&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖能源局政策：煤炭/石油/天然气/电力/核电/风电/光伏"

  # A15. 住房建设（替代失效的住建部HTML源）
  - name: "国务院-住房城乡建设"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E4%BD%8F%E6%88%BF%E5%9F%8E%E4%B9%A1%E5%BB%BA%E8%AE%BE&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖住建部政策：城市更新/建筑资质/房地产/保障房/管网改造"

  # A16. 交通运输（替代失效的交通运输部HTML源）
  - name: "国务院-交通运输"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E4%BA%A4%E9%80%9A%E8%BF%90%E8%BE%93&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖交通运输部政策：公路/铁路/水运/民航/物流/低空经济"

  # A17. 商务政策（替代失效的商务部HTML源）
  - name: "国务院-商务外贸"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E5%95%86%E5%8A%A1+%E5%A4%96%E8%B4%B8&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
    note: "覆盖商务部政策：外贸/自贸区/跨境电商/服务贸易/RCEP"

  # A18. 水利政策（替代失效的水利部HTML源）
  - name: "国务院-水利政策"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E6%B0%B4%E5%88%A9&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
