  # A19. 国防科工（航空航天/海洋装备）
  - name: "国务院-国防科工"
    url: "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary_gwyzcwjk&q=%E5%9B%BD%E9%98%B2%E7%A7%91%E5%B7%A5&timetype=timeqb&sort=pubtime&sortType=1&searchfield=title&p=0&n=20"
    type: "api"
    frequency: "weekly"
    enabled: true
